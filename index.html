<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Work Log</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root{--paper:#FAFAF9;--card:#FFF;--ink:#1A1918;--ink2:#6D6A63;--hair2:#D6D3C9;--guard:#A63030;
    --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--paper);color:var(--ink);font-family:var(--sans);
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .box{background:var(--card);border:1.5px solid var(--ink);border-radius:6px;
    box-shadow:4px 4px 0 var(--hair2);width:100%;max-width:380px}
  .head{font-family:var(--mono);font-weight:600;font-size:13px;letter-spacing:.1em;
    padding:12px 18px;border-bottom:1.5px solid var(--ink)}
  .body{padding:18px}
  label{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--ink2);margin-bottom:7px}
  input{width:100%;font-family:var(--mono);font-size:14px;padding:9px 11px;
    border:1px solid var(--hair2);border-radius:3px;background:var(--paper);color:var(--ink)}
  input:focus{outline:none;border-color:var(--ink)}
  button{width:100%;margin-top:11px;font-family:var(--mono);font-size:11px;letter-spacing:.12em;
    text-transform:uppercase;padding:10px;border:1px solid var(--ink);border-radius:3px;
    background:var(--ink);color:var(--paper);cursor:pointer}
  button:disabled{opacity:.55;cursor:default}
  .msg{font-family:var(--mono);font-size:11px;line-height:1.6;margin-top:11px;min-height:16px;color:var(--ink2)}
  .msg.bad{color:var(--guard)}
</style></head><body>
<form class="box" id="f">
  <div class="head">WORK LOG</div>
  <div class="body">
    <label for="p">Passphrase</label>
    <input id="p" type="password" autocomplete="current-password" autofocus>
    <button id="b" type="submit">Unlock</button>
    <div class="msg" id="m"></div>
  </div>
</form>
